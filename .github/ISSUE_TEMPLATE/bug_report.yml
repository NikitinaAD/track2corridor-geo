name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove sensitive or proprietary data before attaching files.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the input, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the exact command or a small Python example using synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "track2corridor --version"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Python 3.12, Ubuntu 24.04"
    validations:
      required: true
