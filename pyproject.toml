[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "track2corridor-geo"
version = "0.1.0"
description = "Build an auditable centerline and corridor from noisy survey-track points"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Alena Nikitina"}]
keywords = ["gis", "track", "centerline", "corridor", "skeleton", "lidar"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "geopandas>=0.14",
  "laspy[lazrs]>=2.5,<3",
  "networkx>=3.2",
  "numpy>=1.26",
  "pyproj>=3.6",
  "scikit-image>=0.22",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
track2corridor = "track2corridor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
