[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "track2corridor-geo"
version = "0.1.1"
description = "Build an auditable centerline and corridor from ground mobile-mapping trajectory points"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Alena Nikitina"}]
keywords = ["gis", "track", "centerline", "corridor", "skeleton", "lidar"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "geopandas>=0.14",
  "laspy[lazrs]>=2.5,<3",
  "networkx>=3.2",
  "numpy>=1.26",
  "pyproj>=3.6",
  "scikit-image>=0.22",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/NikitinaAD/track2corridor-geo"
Repository = "https://github.com/NikitinaAD/track2corridor-geo"
Issues = "https://github.com/NikitinaAD/track2corridor-geo/issues"

[project.scripts]
track2corridor = "track2corridor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=track2corridor --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
